databases:
  - name: chef-ali-db
    plan: free

services:
  - type: web
    name: restaurant-menu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # تكتبها أنت في لوحة Render
      - key: DATABASE_URL
        fromDatabase:
          name: chef-ali-db
          property: connectionString
