<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشيف علي اللامي — المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0e;--cd:#16161b;--tx:#fff;--mu:#a9a9b3;--ac:#e8c468;--bd:#2a2a32;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Tajawal,system-ui,Tahoma,sans-serif;padding-bottom:90px}
.w{max-width:640px;margin:auto;padding:12px}h1{font-size:28px;margin:6px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.tabs button,.b{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit;white-space:nowrap;cursor:pointer}
.tabs .on,.b.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.b.r{color:#ff6b6b;border-color:#ff6b6b}
.hd{text-align:center;padding:30px 0 6px}.hd h1{font-size:34px;font-weight:800;margin:14px 0 10px}
.lg{width:120px;height:120px;border-radius:30px;object-fit:cover;background:var(--cd);border:1px solid var(--bd);display:grid;place-items:center;font-size:48px;margin:auto}
.ln{display:block;width:70px;height:3px;background:var(--ac);margin:8px auto 14px;border-radius:3px}
.mu{display:block;color:var(--mu);margin:4px 0;text-decoration:none}
.pill{display:inline-block;border:2px solid var(--bd);border-radius:22px;padding:5px 16px;margin:8px 0;background:var(--cd)}
.soc{display:flex;gap:10px;justify-content:center;margin:10px 0}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-weight:800;font-size:20px}
.soc .mp{width:auto;border-radius:24px;padding:0 20px;background:#2d2d33;font-size:16px}
.of{display:inline-block;background:linear-gradient(90deg,#e8365d,#f0546f);border-radius:24px;padding:8px 22px;margin:16px 0 6px;font-weight:700}
.cs{display:flex;gap:10px;overflow-x:auto;padding:8px 0 12px}
.ct{flex:none;width:112px;height:140px;border-radius:20px;border:3px solid #fff;background:var(--cd) center/cover;color:#fff;font:700 15px Tajawal,sans-serif;display:flex;align-items:flex-end;justify-content:center;padding:8px;cursor:pointer;text-shadow:0 1px 4px #000}
.ct.on{border-color:var(--ac);color:var(--ac)}
.sh{display:flex;align-items:center;gap:10px;font-size:26px;margin:34px 0 14px;scroll-margin-top:12px}
.sh i{width:5px;height:30px;background:var(--ac);border-radius:3px}.sh small{color:var(--mu);font-size:14px;font-weight:400}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{position:relative;aspect-ratio:3/3.7;border-radius:22px;border:1px solid var(--bd);overflow:hidden;background:#1c1c22 center/cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:.4}
.cd:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.85))}
.pl,.qp{position:absolute;top:8px;left:8px;z-index:2}
.pl{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#111;font-size:26px;font-weight:700}
.qp{display:flex;align-items:center;gap:6px;background:var(--ac);color:#111;border-radius:22px;padding:2px 6px}
.qp button{border:0;background:none;font-size:24px;width:30px;height:34px;font-weight:700}
.bd{position:absolute;top:10px;right:10px;z-index:2;background:var(--ac);color:#111;border-radius:14px;padding:2px 10px;font-weight:700;font-size:14px}
.ft{position:absolute;inset:auto 0 0 0;z-index:2;padding:10px 12px}
.ft b{display:block;font-size:17px;line-height:1.3}.ft small{display:block;color:#ddd;font-size:12px;max-height:2.8em;overflow:hidden}
.pp{display:flex;gap:8px;align-items:baseline;margin-top:4px}.pp span{color:var(--ac);font-weight:800;font-size:18px}.pp s{color:var(--mu);font-size:12px}
.br{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0}
.br h3{margin:0 0 6px;font-size:21px}.br .mp2{display:inline-block;background:var(--ac);color:#111;border-radius:22px;padding:8px 20px;font-weight:700;text-decoration:none;margin-top:8px}
.fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:4;width:48px;height:48px;border-radius:50%;border:0;background:#f1f1f1;font-size:22px}
.it{display:flex;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0}
.im{width:92px;height:92px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:grid;place-items:center;font-size:32px}
.it .in{flex:1;min-width:0}.it b{display:block}.d{color:var(--mu);font-size:14px}
.bar{position:fixed;inset:auto 0 0 0;z-index:3;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd)}
.bar button{width:100%;max-width:616px;display:block;margin:auto;padding:13px;border:0;border-radius:16px;background:var(--ac);color:#111;font:800 17px Tajawal,sans-serif}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 40px;z-index:6}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:16px;padding:3px 10px;margin:3px}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:8px 16px;border-radius:20px;z-index:9;display:none}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:0}
.sp{position:fixed;inset:0;z-index:5;background:#0b0b0e center/cover;overflow:hidden}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sov{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.82))}
.sc{position:relative;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2vh;padding:calc(3vh + env(safe-area-inset-top,0px)) 20px calc(3vh + env(safe-area-inset-bottom,0px));text-align:center}
.sp .lg{border-radius:50%;width:clamp(80px,17vh,150px);height:clamp(80px,17vh,150px);font-size:clamp(32px,7vh,60px);border:3px solid rgba(255,255,255,.6)}
.sp .soc{margin:0}.sp .soc:empty{display:none}.sp .soc a{width:clamp(36px,5.5vh,48px);height:clamp(36px,5.5vh,48px);font-size:clamp(16px,2.4vh,20px)}.sp .soc .mp{width:auto;font-size:clamp(14px,2.2vh,16px)}
.sp h1{font-size:clamp(24px,5vh,44px);line-height:1.3;font-weight:800;margin:1.5vh 0 0}
.bps{display:flex;flex-wrap:wrap;gap:1.2vh 10px;justify-content:center;margin:1.2vh 0;max-height:30vh;overflow-y:auto}
.bp{border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;border-radius:30px;padding:clamp(8px,1.6vh,13px) 24px;font:700 clamp(15px,2.3vh,18px) Tajawal,sans-serif;cursor:pointer}
.bp.on{background:#fff;color:#111;border-color:#fff}
.go{border:0;border-radius:36px;background:var(--ac);color:#111;padding:clamp(11px,2.2vh,18px) 54px;font:800 clamp(18px,2.8vh,22px) Tajawal,sans-serif;cursor:pointer;margin-top:1vh}

.qrw{position:fixed;inset:0;z-index:9;background:#fff;color:#000;overflow:auto;padding:12px}
.qrw .tb{display:flex;gap:8px;margin-bottom:12px}.qrw .tb button{flex:1;padding:12px;border-radius:12px;border:1px solid #ccc;background:#f4f4f4;color:#000;font:700 16px Tajawal,sans-serif}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.qc{border:2px solid #000;border-radius:14px;padding:12px;text-align:center;break-inside:avoid}
.qc svg{width:100%;height:auto;max-width:220px}.qc b{display:block;font-size:26px}.qc small{color:#444;display:block}
@media print{body>*:not(.qrw){display:none!important}.qrw{position:static;overflow:visible}.qrw .tb{display:none}.qg{grid-template-columns:repeat(3,1fr)}}
</style><script src="/qr.js"></script></head><body>
<div class="w" id="app"></div><div id="ov"></div><div id="t"></div>

<script>
let D={name:'',branches:[]};
const TBL=window.__TBL||null;
let TK='',sp=1,bi=0,cat='',cart={},can=false,art=null,F=null,arm=0;
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US')+' د.ع';
const uid=()=>Math.random().toString(36).slice(2,8);
const B=()=>D.branches[bi];
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function sel(){return !TBL&&D.branches.length>1?'<div class="tabs">'+D.branches.map((b,i)=>`<button class="${i==bi?'on':''}" onclick="pickB(${i})">${e(b.name)}</button>`).join('')+'</div>':''}
function pickB(i){bi=i;cat='';cart={};render();if($('#ov').innerHTML)adm()}
function socs(b){const s=(k,bg,t)=>u(b[k])?`<a href="${u(b[k])}" target="_blank" rel="noopener" style="background:${bg}">${t}</a>`:'';return `<div class="soc">${s('map','#2d2d33','📍 الموقع').replace('<a ','<a class="mp" ')}${s('tt','#000','♪')}${s('fb','#1877f2','f')}${s('ig','linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)','◎')}</div>`}
function splash(){
 const b=B();
 $('#app').innerHTML=`<div class="sp" style="${D.bg?`background-image:url(${D.bg})`:''}">${D.vid?`<video class="bgv" src="${e(D.vid)}" autoplay muted loop playsinline></video>`:''}<div class="sov"></div>
 <div class="sc">${can&&art?'<button class="fab" onclick="adm()">⚙️</button>':''}
 <div>${D.logo?`<img class="lg" src="${D.logo}" alt="">`:'<div class="lg">🍽</div>'}<h1>${e(D.name)}</h1></div>
 <div>${D.branches.length>1?`<div class="mu" style="color:#ddd">اختر الفرع</div><div class="bps">${D.branches.map((x,i)=>`<button class="bp ${i==bi?'on':''}" onclick="bi=${i};cart={};splash()">${e(x.name)}</button>`).join('')}</div>`:''}<button class="go" onclick="sp=0;render()">دخول المنيو</button></div>
 ${socs(b)}</div></div>`;
}
function bgimg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const s=Math.min(1,900/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);D.bg=c.toDataURL('image/jpeg',.7);toast('تم رفع الصورة')};m.src=r.result};r.readAsDataURL(f)}
async function vid(inp){const f=inp.files[0];if(!f)return;toast('جارٍ رفع الفيديو…');try{const r=await fetch('/api/upload?ext='+encodeURIComponent((f.name.split('.').pop()||'mp4').slice(0,5)),{method:'POST',headers:{'x-admin-token':TK},body:f});const j=await r.json();if(!r.ok)throw 0;D.vid=j.url;toast('تم الرفع — اضغط حفظ ونشر')}catch(x){toast('فشل الرفع')}}
function u(s){return /^https?:\/\//.test(s||'')?e(s):''}
function go(c){cat=c;render();const s=document.getElementById('sec');if(s)s.scrollIntoView({behavior:'smooth'})}
function render(){
 const b=B();
 if(!b){$('#app').innerHTML='<p>لا توجد فروع</p>';return}
 if(sp){splash();return}
 const cnt=Object.values(cart).reduce((a,c)=>a+c,0),tot=b.items.reduce((s,i)=>s+(cart[i.id]||0)*i.p,0);
 const px=(document.querySelector('.cs')||{}).scrollLeft||0;
 const cs=b.cats.filter(c=>b.items.some(i=>i.c==c)),cur=cs.includes(cat)?cat:cs[0],dis=b.items.some(i=>i.o>i.p);
 const card=i=>{const q=cart[i.id]||0,off=i.o>i.p?Math.round((1-i.p/i.o)*100):0;
  return `<div class="cd" style="${i.img?`background-image:url(${i.img})`:''}"><div class="ph">${i.img?'':'🍽'}</div>${q?`<div class="qp"><button onclick="add('${i.id}',-1)">−</button><b>${q}</b><button onclick="add('${i.id}',1)">+</button></div>`:`<button class="pl" onclick="add('${i.id}',1)">+</button>`}${off?`<span class="bd">-${off}%</span>`:''}<div class="ft"><b>${e(i.n)}</b>${i.d?`<small>${e(i.d)}</small>`:''}<div class="pp"><span>${money(i.p)}</span>${i.o>i.p?`<s>${money(i.o)}</s>`:''}</div></div></div>`};
 const so=(k,bg,t)=>u(b[k])?`<a href="${u(b[k])}" target="_blank" rel="noopener" style="background:${bg}">${t}</a>`:'';
 $('#app').innerHTML=`${can&&art?'<button class="fab" onclick="adm()">⚙️</button>':''}
 <div class="hd">${D.logo?`<img class="lg" src="${D.logo}" alt="">`:'<div class="lg">🍽</div>'}<h1>${e(D.name)}</h1><i class="ln"></i>${sel()}
 ${b.ad?`<span class="mu">📍 ${e(b.ad)}</span>`:''}${b.wa?`<a class="mu" dir="ltr" href="tel:${e(b.wa)}">📞 ${e(b.wa)}</a>`:''}${b.hr?`<span class="pill">🕒 ${e(b.hr)}</span>`:''}
 <div class="soc">${so('map','#2d2d33','📍 الموقع').replace('<a ','<a class="mp" ')}${so('tt','#000','♪')}${so('fb','#1877f2','f')}${so('ig','linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)','◎')}</div>
 ${dis?'<span class="of">🎉 عروض وخصومات</span>':''}</div>
 <div class="cs">${cs.map(c=>`<button class="ct ${c==cur?'on':''}" data-c="${e(c)}" style="${ci(b,c)?`background-image:linear-gradient(transparent 40%,rgba(0,0,0,.7)),url(${ci(b,c)})`:''}" onclick="go(this.dataset.c)">${e(c)}</button>`).join('')}</div>
 ${cur?(()=>{const l=b.items.filter(i=>i.c==cur);return `<h2 class="sh" id="sec"><i></i>${e(cur)} <small>(${l.length})</small></h2><div class="gr">${l.map(card).join('')}</div>`})():''}
 <h2 class="sh"><i></i>فروعنا 🏬</h2>${D.branches.map(x=>`<div class="br"><h3>${e(x.name)}</h3>${x.ad?`<div class="mu">📍 ${e(x.ad)}</div>`:''}${x.wa?`<a class="mu" dir="ltr" href="tel:${e(x.wa)}">📞 ${e(x.wa)}</a>`:''}${u(x.map)?`<a class="mp2" href="${u(x.map)}" target="_blank" rel="noopener">📍 الموقع</a>`:''}</div>`).join('')}
 
 ${cnt?`<div class="bar"><button onclick="sheet()">عرض الطلب (${cnt}) — ${money(tot)}</button></div>`:''}`;
 const q=document.querySelector('.cs');if(q)q.scrollLeft=px;
}
function ci(b,c){if(b.catImg&&b.catImg[c])return b.catImg[c];const i=b.items.find(i=>i.c==c&&i.img);return i&&i.img}
function logo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const s=Math.min(1,300/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);D.logo=c.toDataURL('image/jpeg',.8);toast('تم رفع الشعار')};m.src=r.result};r.readAsDataURL(f)}
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render()}
function sheet(){
 const b=B(),ls=b.items.filter(i=>cart[i.id]);
 const tot=ls.reduce((s,i)=>s+cart[i.id]*i.p,0);
 $('#ov').innerHTML=`<div class="ov"><div class="w"><h1>طلبك — ${e(b.name)}</h1>${ls.map(i=>`<div class="row box"><span>${cart[i.id]}× ${e(i.n)}</span><b style="text-align:left">${money(cart[i.id]*i.p)}</b></div>`).join('')}
 <h3>المجموع: ${money(tot)}</h3>${TBL?`<div class="box" style="font-weight:800;font-size:18px">🪑 طاولة رقم: ${e(TBL.t)}</div>`:''}<input id="nm" placeholder="الاسم *" autocomplete="name"><input id="ph" type="tel" inputmode="tel" placeholder="رقم الهاتف *" autocomplete="tel"><input id="ar" placeholder="${TBL?'المنطقة (اختياري)':'المنطقة / العنوان *'}"><textarea id="nt" rows="2" placeholder="ملاحظات"></textarea>
 <button class="b p" style="width:100%;padding:13px" onclick="send()">إرسال الطلب عبر واتساب 💬</button>
 <button class="b" style="width:100%;margin-top:8px" onclick="$('#ov').innerHTML=''">رجوع</button></div></div>`;
}
function send(){
 const b=B(),ls=b.items.filter(i=>cart[i.id]);
 let w=String(b.wa||'').replace(/\D/g,'');if(!w){toast('رقم واتساب الفرع غير مضاف');return}
 if(w[0]=='0')w='964'+w.slice(1);
 const tot=ls.reduce((s,i)=>s+cart[i.id]*i.p,0),v=id=>$('#'+id).value.trim();
 if(!v('nm')){toast('اكتب الاسم');$('#nm').focus();return}
 if(v('ph').replace(/\D/g,'').length<7){toast('اكتب رقم هاتف صحيح');$('#ph').focus();return}
 if(!TBL&&!v('ar')){toast('اكتب المنطقة');$('#ar').focus();return}
 let m=`🛎 طلب جديد — ${b.name}\n\n`+ls.map(i=>`${cart[i.id]}× ${i.n} — ${money(cart[i.id]*i.p)}`).join('\n')+`\n\nالمجموع: ${money(tot)}`;
 m+='\n';if(TBL)m+=`\n🪑 الطاولة: ${TBL.t}`;m+=`\n👤 الاسم: ${v('nm')}\n📞 الرقم: ${v('ph')}`;if(v('ar'))m+=`\n📍 المنطقة: ${v('ar')}`;if(v('nt'))m+=`\n📝 ملاحظات: ${v('nt')}`;
 const a=document.createElement('a');a.href='https://wa.me/'+w+'?text='+encodeURIComponent(m);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
/* ---------- لوحة التحكم ---------- */
function adm(go){sp=0;const o0=document.querySelector('#ov .ov'),st=o0?o0.scrollTop:0;adm0();const o1=document.querySelector('#ov .ov');if(o1)o1.scrollTop=st;if(go===1){const p=document.getElementById('pf');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}}
function adm0(){
 const b=B();
 $('#ov').innerHTML=`<div class="ov"><div class="w"><div class="row"><h1>لوحة التحكم</h1><button class="b p" style="flex:none" onclick="save()">💾 حفظ ونشر</button><button class="b" style="flex:none" onclick="$('#ov').innerHTML='';render()">إغلاق</button></div>
 <div class="box"><b>اسم المطعم</b><input value="${e(D.name)}" oninput="D.name=this.value"><b>الشعار</b><input type="file" accept="image/*" onchange="logo(this)"></div>
 <div class="box"><b>صفحة الدخول</b><div class="d">صورة الخلفية</div><input type="file" accept="image/*" onchange="bgimg(this)"><div class="d">فيديو الخلفية (قصير، يفضل أقل من 10 ميغا)</div><input type="file" accept="video/*" onchange="vid(this)">
 <button class="b r" onclick="D.bg='';D.vid='';toast('تمت الإزالة — اضغط حفظ ونشر');adm()">إزالة الصورة والفيديو</button></div>
 ${sel()}<button class="b" onclick="addB()">+ فرع جديد</button>
 <div class="box"><b>بيانات الفرع</b><input value="${e(b.name)}" placeholder="اسم الفرع" oninput="b_(this.value,'name')"><input dir="ltr" value="${e(b.wa)}" placeholder="رقم واتساب الفرع 07xxxxxxxxx" oninput="b_(this.value,'wa')">
 <input value="${e(b.ad)}" placeholder="العنوان" oninput="b_(this.value,'ad')"><input value="${e(b.hr)}" placeholder="ساعات العمل (مثال: 11:00 ص – 11:30 م)" oninput="b_(this.value,'hr')"><input dir="ltr" value="${e(b.map)}" placeholder="رابط الموقع على الخريطة https://" oninput="b_(this.value,'map')"><input dir="ltr" value="${e(b.ig)}" placeholder="رابط انستغرام" oninput="b_(this.value,'ig')"><input dir="ltr" value="${e(b.fb)}" placeholder="رابط فيسبوك" oninput="b_(this.value,'fb')"><input dir="ltr" value="${e(b.tt)}" placeholder="رابط تيك توك" oninput="b_(this.value,'tt')"><div class="d" dir="ltr">رابط الفرع: #${b.id}</div>
 <button class="b r" style="margin-top:8px" onclick="delB()">${arm?'اضغط مرة ثانية للتأكيد':'حذف الفرع'}</button></div>
 <div class="box"><b>الأصناف (الأقسام)</b><div class="d">يمكنك إضافة صورة لكل قسم تظهر على زره في المنيو</div><div>${b.cats.map(c=>{const im=b.catImg&&b.catImg[c];return `<div class="row" style="align-items:center;gap:8px;margin:8px 0">${im?`<img class="im" style="width:48px;height:48px" src="${im}" alt="">`:'<div class="im" style="width:48px;height:48px">🖼</div>'}<b style="flex:1">${e(c)}</b><label class="b" style="flex:none;cursor:pointer">${im?'تغيير':'صورة'}<input type="file" accept="image/*" hidden data-c="${e(c)}" onchange="catimg(this)"></label>${im?`<button class="lk" data-c="${e(c)}" onclick="rmCi(this.dataset.c)">إزالة</button>`:''}<button class="lk" style="color:#d33" data-c="${e(c)}" onclick="delC(this.dataset.c)">✕</button></div>`}).join('')}</div>
 <div class="row"><input id="nc" placeholder="قسم جديد"><button class="b" style="flex:none" onclick="addC()">إضافة</button></div></div>
 <div class="box"><b>🪑 باركود الطاولات</b><div class="d">أدخل عدد الطاولات (مثل 12) أو مدى (1-20) أو أسماء مفصولة بفاصلة (A1,A2,VIP). الباركود خاص بالفرع المحدد أعلاه، ورقم الطاولة فيه موقَّع ولا يمكن للزبون تغييره.</div>
 <input id="tq" placeholder="مثال: 12 أو 1-20 أو A1,A2,VIP"><input id="to" dir="ltr" value="${e(location.origin)}"><button class="b p" style="width:100%;margin-top:6px" onclick="qrGen()">إنشاء الباركود وطباعته</button></div>
 <div class="box" id="pf"><b>${F&&F.id?'تعديل منتج':'إضافة منتج'}</b>
 <input id="fn" placeholder="اسم المنتج" value="${e(F?F.n:'')}"><textarea id="fd" rows="2" placeholder="الوصف">${e(F?F.d:'')}</textarea>
 <input id="fo" type="number" inputmode="numeric" placeholder="السعر قبل الخصم (اختياري)" value="${F&&F.o||''}"><div class="row"><input id="fp" type="number" inputmode="numeric" placeholder="السعر" value="${F?F.p:''}"><select id="fc">${b.cats.map(c=>`<option ${F&&F.c==c||!F&&c==cat?'selected':''}>${e(c)}</option>`).join('')}</select></div>
 <input type="file" accept="image/*" onchange="img(this)"><div id="pv">${F&&F.img?`<img class="im" src="${F.img}" alt="">`:''}</div>
 <button class="b p" style="width:100%;margin-top:8px" onclick="saveI()">${F&&F.id?'تحديث المنتج':'إضافة المنتج'}</button></div>
 ${b.items.map(i=>`<div class="it">${i.img?`<img class="im" style="width:56px;height:56px" src="${i.img}" alt="">`:'<div class="im" style="width:56px;height:56px">🍽</div>'}<div class="in"><b>${e(i.n)}</b><div class="d">${e(i.c)} · ${money(i.p)}</div><button class="lk" onclick="edI('${i.id}')">تعديل</button> &nbsp; <button class="lk" style="color:#d33" onclick="delI('${i.id}')">حذف</button></div></div>`).join('')}
 </div></div>`;
}
function b_(v,k){B()[k]=v}
function addB(){D.branches.push({id:'b'+uid(),name:'فرع جديد',wa:'',cats:['عام'],items:[]});bi=D.branches.length-1;cat='';F=null;adm()}
function delB(){if(D.branches.length<2){toast('يجب بقاء فرع واحد');return}if(!arm){arm=1;adm();return}arm=0;D.branches.splice(bi,1);bi=0;cat='';adm()}
function addC(){const v=$('#nc').value.trim(),b=B();if(v&&!b.cats.includes(v)){b.cats.push(v);adm()}}
function delC(c){const b=B();if(b.items.some(i=>i.c==c)){toast('انقل أو احذف منتجات القسم أولاً');return}b.cats=b.cats.filter(x=>x!=c);if(b.catImg)delete b.catImg[c];adm()}
function img(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const m=new Image();m.onload=()=>{const s=Math.min(1,480/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);
  F=F||{};F.img=c.toDataURL('image/jpeg',.72);$('#pv').innerHTML=`<img class="im" src="${F.img}" alt="">`};m.src=r.result};r.readAsDataURL(f);
}
function saveI(){
 const n=$('#fn').value.trim();if(!n){toast('اكتب اسم المنتج');return}
 const o={id:F&&F.id||'i'+uid(),n,d:$('#fd').value.trim(),p:Number($('#fp').value)||0,o:Number($('#fo').value)||0,c:$('#fc').value,img:F&&F.img||''},b=B(),k=b.items.findIndex(i=>i.id==o.id);
 if(k>=0)b.items[k]=o;else b.items.push(o);F=null;cat=o.c;adm();toast('تمت الإضافة — اضغط حفظ ونشر');
}
function edI(id){F={...B().items.find(i=>i.id==id)};adm(1)}
function delI(id){const b=B();b.items=b.items.filter(i=>i.id!=id);adm()}
function catimg(inp){const f=inp.files[0],c=inp.dataset.c;if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const s=Math.min(1,360/Math.max(m.width,m.height)),k=document.createElement('canvas');k.width=m.width*s;k.height=m.height*s;k.getContext('2d').drawImage(m,0,0,k.width,k.height);const b=B();(b.catImg=b.catImg||{})[c]=k.toDataURL('image/jpeg',.75);adm();toast('تمت إضافة صورة القسم — اضغط حفظ ونشر')};m.src=r.result};r.readAsDataURL(f)}
function rmCi(c){const b=B();if(b.catImg)delete b.catImg[c];adm()}
function parseTables(s){s=s.trim();if(/^\d+$/.test(s))return Array.from({length:Math.min(300,+s)},(_,i)=>String(i+1));
 const m=/^(\d+)\s*[-–]\s*(\d+)$/.exec(s);if(m){const a=+m[1],z=Math.min(+m[2],a+299),o=[];for(let i=a;i<=z;i++)o.push(String(i));return o}
 return s.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean)}
async function qrGen(){
 const b=B(),list=parseTables($('#tq').value||'');if(!list.length){toast('اكتب عدد الطاولات');return}
 if(list.some(t=>!/^[\w\u0600-\u06FF-]{1,12}$/.test(t))){toast('اسم الطاولة: حروف وأرقام فقط (حتى 12)');return}
 const org=($('#to').value||location.origin).replace(/\/+$/,'');
 try{const r=await fetch('/api/qr',{method:'POST',headers:{'content-type':'application/json','x-admin-token':TK},body:JSON.stringify({b:b.id,tables:list})});if(!r.ok)throw 0;const j=await r.json();
  const w=document.createElement('div');w.className='qrw';
  w.innerHTML=`<div class="tb"><button onclick="window.print()">🖨 طباعة / حفظ PDF</button><button onclick="this.closest('.qrw').remove()">إغلاق</button></div><div class="qg">${j.items.map(x=>{const url=`${org}/t/${encodeURIComponent(b.id)}/${encodeURIComponent(x.t)}/${x.s}`;return `<div class="qc">${QR.svg(url,220)}<b>طاولة ${e(x.t)}</b><small>${e(D.name)}</small><small>${e(b.name)}</small></div>`}).join('')}</div>`;
  document.body.appendChild(w)}catch(x){toast('تعذر إنشاء الباركود')}}
async function login(){const p=prompt('كلمة مرور الإدارة');if(!p)return;const r=await fetch('/api/login',{method:'POST',headers:{'x-admin-token':p}});if(r.ok){TK=p;sessionStorage.setItem('tk',p);can=true;art=true;sp=0;render()}else toast('كلمة المرور غير صحيحة')}
async function save(){toast('جارٍ الحفظ…');try{const r=await fetch('/api/menu',{method:'POST',headers:{'content-type':'application/json','x-admin-token':TK},body:JSON.stringify(D)});toast(r.ok?'تم الحفظ والنشر ✅':'تعذر الحفظ ('+r.status+')')}catch(x){toast('تعذر الحفظ')}}
const h0=location.hash.slice(1);
(async()=>{try{D=await(await fetch('/api/menu')).json()}catch(x){}
 const hi=D.branches.findIndex(b=>b.id==(TBL?TBL.b:h0));if(hi>=0){bi=hi;sp=0}else if(TBL){location.replace('/');return}
 TK=sessionStorage.getItem('tk')||'';if(TK){try{const r=await fetch('/api/login',{method:'POST',headers:{'x-admin-token':TK}});if(r.ok){can=true;art=true}}catch(x){}}
 render();if(window.__ADM&&!can)login()})();
</script></body></html>
