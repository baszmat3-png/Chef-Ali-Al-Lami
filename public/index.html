<script>
const TBL=window.__TBL||null;
let D={name:'',branches:[]},TOP={},RS={};
let sp=1,bi=0,cat='',cart={};
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch(x){}
const HS=on=>`<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 20.6l-1.3-1.2C5.9 15 3 12.3 3 8.9 3 6.2 5.1 4.2 7.7 4.2c1.6 0 3.2.8 4.3 2 1.1-1.2 2.7-2 4.3-2C18.9 4.2 21 6.2 21 8.9c0 3.4-2.9 6.1-7.7 10.5L12 20.6z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
function fav(id){FAV.has(id)?FAV.delete(id):FAV.add(id);try{localStorage.setItem('fav',JSON.stringify([...FAV]))}catch(x){}render()}
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US')+' د.ع';
const B=()=>D.branches[bi];
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2600)}
function sel(){return !TBL&&D.branches.length>1?'<div class="tabs">'+D.branches.map((b,i)=>`<button class="${i==bi?'on':''}" onclick="pickB(${i})">${e(b.name)}</button>`).join('')+'</div>':''}
function pickB(i){bi=i;cat='';cart={};render()}
const UI={en:{'دخول المنيو':'Enter menu','اختر الفرع':'Choose branch','الأكثر طلباً':'Most ordered','المفضلة':'Favorites','فروعنا':'Our branches','عروض وخصومات':'Offers & discounts','عرض الطلب':'View order','الأقسام':'Categories','إضافة':'Add','طلبك':'Your order','الاسم':'Name','رقم الهاتف':'Phone','ملاحظات':'Notes','المجموع':'Total','رجوع':'Back','إرسال الطلب':'Send order','قيّم تجربتك':'Rate your experience','رقم الطاولة':'Table','كل الأصناف':'All items'},
 ku:{'دخول المنيو':'چوونە ناو مینیو','اختر الفرع':'لقەکە هەڵبژێرە','الأكثر طلباً':'زۆرترین داواکراو','المفضلة':'دڵخوازەکان','فروعنا':'لقەکانمان','عروض وخصومات':'ئۆفەر و داشکاندن','عرض الطلب':'بینینی داواکاری','الأقسام':'بەشەکان','إضافة':'زیادکردن','طلبك':'داواکارییەکەت','الاسم':'ناو','رقم الهاتف':'ژمارەی مۆبایل','ملاحظات':'تێبینی','المجموع':'کۆی گشتی','رجوع':'گەڕانەوە','إرسال الطلب':'ناردنی داواکاری','قيّم تجربتك':'هەڵسەنگاندن','رقم الطاولة':'مێز','كل الأصناف':'هەموو خواردنەکان'}};
const LGN={ar:'عربي',en:'EN',ku:'کوردی'};
const LGo=()=>{try{return localStorage.getItem('lg')||'ar'}catch(x){return 'ar'}};
const T=s=>{const l=LGo();return (UI[l]&&UI[l][s])||s};
const tn=i=>{const l=LGo(),t=i.tr&&i.tr[l];return (l!='ar'&&t&&t.n)||i.n};
const td=i=>{const l=LGo(),t=i.tr&&i.tr[l];return (l!='ar'&&t&&t.d)||i.d};
const tc=(b,c)=>{const l=LGo(),t=b&&b.ctr&&b.ctr[c];return (l!='ar'&&t&&t[l])||c};
function hasTr(){return D.branches.some(b=>Object.values(b.ctr||{}).some(t=>t.en||t.ku)||(b.items||[]).some(i=>i.tr&&((i.tr.en&&i.tr.en.n)||(i.tr.ku&&i.tr.ku.n))))}
function lgb(c){return hasTr()?`<button class="lgb ${c||''}" onclick="setLg()">🌐 ${LGN[LGo()]}</button>`:''}
function setLg(){const o=['ar','en','ku'],n=o[(o.indexOf(LGo())+1)%3];try{localStorage.setItem('lg',n)}catch(x){}document.documentElement.dir=n=='en'?'ltr':'rtl';document.documentElement.lang=n;sp?splash():render()}
function u(s){return /^https?:\/\//.test(s||'')?e(s):''}
const GOVS=1;
function phs(b){const l=(Array.isArray(b.ph)?b.ph:[]).filter(Boolean);return l.length?l:(b.wa?[b.wa]:[])}
function ctc(b){return (b.ad||b.gov?`<span class="mu">📍 ${e([b.gov&&!String(b.ad||'').includes(b.gov)?b.gov:'',b.ad].filter(Boolean).join(' – '))}</span>`:'')+phs(b).map(n=>`<a class="mu" dir="ltr" href="tel:${e(n)}">📞 ${e(n)}</a>`).join('')+(b.hr?`<span class="pill">🕒 ${e(b.hr)}</span>`:'')+(b.nt?`<span class="mu nt">${e(b.nt)}</span>`:'')}
function soc2(b){const s=(k,bg,t)=>u(b[k])?`<a href="${u(b[k])}" target="_blank" rel="noopener" style="background:${bg}">${t}</a>`:'';return `<div class="soc">${s('map','#2d2d33','📍 الموقع').replace('<a ','<a class="mp" ')}${s('tt','#000','♪')}${s('fb','#1877f2','f')}${s('ig','linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)','◎')}${s('sn','#fffc00;color:#000','👻')}</div>`}
function socs(b){return soc2(b)}
function splash(){
 const b=B();
 $('#app').innerHTML=`<div class="sp" style="${D.bg?`background-image:url(${e(D.bg)})`:''}">${D.vid?`<video class="bgv" src="${e(D.vid)}" autoplay muted loop playsinline></video>`:''}<div class="sov"></div>${lgb('sl')}
 <div class="sc">
 <div>${D.logo?`<img class="lg" src="${e(D.logo)}" alt="">`:'<div class="lg">🍽</div>'}<h1>${e(D.name)}</h1></div>
 <div>${D.branches.length>1?`<div class="mu" style="color:#ddd">${T('اختر الفرع')}</div><div class="bps">${D.branches.map((x,i)=>`<button class="bp ${i==bi?'on':''}" onclick="bi=${i};cart={};splash()">${e(x.name)}</button>`).join('')}</div>`:''}<button class="go" onclick="sp=0;render()">${T('دخول المنيو')}</button></div>
 ${socs(b)}</div></div>`;
}
function catsOf(b){return b.cats.filter(c=>b.items.some(i=>i.c==c))}
function topOf(b){if(D.noTop)return[];return (TOP[b.id]||[]).map(id=>b.items.find(i=>i.id==id)).filter(Boolean).slice(0,8)}
function drw(o){const d=$('#dw');if(!o){d.innerHTML='';return}const b=B(),cs=catsOf(b),cur=cs.includes(cat)?cat:cs[0],tp=topOf(b);
 d.innerHTML=`<div class="dwb" onclick="drw(0)"></div><aside class="dwp"><div class="dwh">${D.logo?`<img src="${e(D.logo)}" alt="">`:'<div class="dl">🍽</div>'}<b>${e(D.name)}</b><button onclick="drw(0)" aria-label="إغلاق">✕</button></div><div class="dwl">${T('الأقسام')}</div><nav class="dwn">${tp.length?`<button onclick="drw(0);goTop()"><span>🔥 ${T('الأكثر طلباً')}</span><small>${tp.length}</small></button>`:''}${cs.map(c=>`<button class="${c==cur?'on':''}" data-c="${e(c)}" onclick="pickC(this.dataset.c)"><span>${e(tc(b,c))}</span><small>${b.items.filter(i=>i.c==c).length}</small></button>`).join('')}</nav></aside>`}
function allRow(i){const q=cart[i.id]||0;return `<div class="alr"><div class="ali"><b>${e(tn(i))}</b>${td(i)?`<small>${e(td(i))}</small>`:''}</div><div class="alp">${money(i.p)}${i.o>i.p?`<s>${money(i.o)}</s>`:''}</div>${q?`<div class="qp"><button onclick="add('${i.id}',-1)">−</button><b>${q}</b><button onclick="add('${i.id}',1)">+</button></div>`:`<button class="pl" onclick="add('${i.id}',1)">+</button>`}</div>`}
function allView(b,cs,card){return `<h2 class="sh" id="sec"><i></i>📋 ${T('كل الأصناف')} <small>(${b.items.length})</small></h2>`+cs.map(c=>{const l=b.items.filter(i=>i.c==c);return `<h3 class="alh">${e(tc(b,c))} <small>(${l.length})</small></h3><div class="gr">${l.map(card).join('')}</div>`}).join('')}
function pickC(c){drw(0);go(c)}
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')drw(0)});
function go(c){cat=c;render();const s=document.getElementById('sec');if(s)s.scrollIntoView({behavior:'smooth'})}
function goTop(){const s=document.getElementById('top');if(s)s.scrollIntoView({behavior:'smooth'})}
const scr=()=>['.cs','.hs'].map(s=>(document.querySelector(s)||{}).scrollLeft||0);
function render(){
 const b=B();
 if(!b){$('#app').innerHTML='<p>لا توجد فروع</p>';return}
 if(sp){splash();return}
 const cnt=Object.values(cart).reduce((a,c)=>a+c,0),tot=b.items.reduce((s,i)=>s+(cart[i.id]||0)*i.p,0);
 const px=scr();
 const fvs=b.items.filter(i=>FAV.has(i.id)),cs=catsOf(b),cur=cat=='*'?'*':(cs.includes(cat)?cat:cs[0]),dis=b.items.some(i=>i.o>i.p),tp=topOf(b);
 const card=i=>{const q=cart[i.id]||0,off=i.o>i.p?Math.round((1-i.p/i.o)*100):0,fv=FAV.has(i.id);
  return `<div class="cd"><div class="im2" style="${i.img?`background-image:url(${e(i.img)})`:''}">${i.img?'':'<div class="ph">🍽</div>'}</div>${off?`<span class="bd">-${off}%</span>`:''}<button class="hrt ${fv?'on':''}" onclick="fav('${i.id}')" aria-label="المفضلة">${HS(fv)}</button><div class="acs">${q?`<div class="qp"><button onclick="add('${i.id}',-1)">−</button><b>${q}</b><button onclick="add('${i.id}',1)">+</button></div>`:`<button class="pl" onclick="add('${i.id}',1)"><span class="pt">${T('إضافة')}</span>+</button>`}</div><div class="ft"><b>${e(tn(i))}</b>${td(i)?`<small>${e(td(i))}</small>`:''}<div class="pp"><span>${money(i.p)}</span>${i.o>i.p?`<s>${money(i.o)}</s>`:''}</div></div></div>`};
 const so=(k,bg,t)=>u(b[k])?`<a href="${u(b[k])}" target="_blank" rel="noopener" style="background:${bg}">${t}</a>`:'';
 $('#app').innerHTML=`<header class="tb"><button class="mbtn" onclick="drw(1)" aria-label="الأقسام"><i></i><i></i><i></i></button><div class="tn">${D.logo?`<img src="${e(D.logo)}" alt="">`:'<div class="tl">🍽</div>'}<b>${e(D.name)}</b></div>${lgb()}${TBL?`<span class="tt">🪑 طاولة ${e(TBL.n)}</span>`:''}</header>
 <div class="hd">${D.logo?`<img class="lg" src="${e(D.logo)}" alt="">`:'<div class="lg">🍽</div>'}<h1>${e(D.name)}</h1><i class="ln"></i>${sel()}
 ${ctc(b)}
 ${b.rt?`<button class="rtb" onclick="${RS[b.id]?'ratesM()':'rateM()'}">⭐ ${RS[b.id]?RS[b.id].a+' ('+RS[b.id].n+')':T('قيّم تجربتك')}</button>`:''}${soc2(b)}${b.noOrd?'<div class="noord">⛔ استقبال الطلبات متوقف مؤقتاً</div>':''}
 ${dis?`<span class="of">🎉 ${T('عروض وخصومات')}</span>`:''}</div>
 ${tp.length?`<h2 class="sh" id="top"><i></i>🔥 ${T('الأكثر طلباً')}</h2><div class="hs">${tp.map(card).join('')}</div>`:''}
 ${fvs.length?`<h2 class="sh"><i></i>❤️ ${T('المفضلة')}</h2><div class="hs">${fvs.map(card).join('')}</div>`:''}
 <div class="cs"><button class="ct ni ${cur=='*'?'on':''}" data-c="*" onclick="go(this.dataset.c)">📋 ${T('كل الأصناف')}</button>${cs.map(c=>`<button class="ct ${c==cur?'on':''} ${ci(b,c)?'':'ni'}" data-c="${e(c)}" style="${ci(b,c)?`background-image:linear-gradient(transparent 40%,rgba(0,0,0,.7)),url(${e(ci(b,c))})`:''}" onclick="go(this.dataset.c)">${e(tc(b,c))}</button>`).join('')}</div>
 ${cur=='*'?allView(b,cs,card):cur?(()=>{const l=b.items.filter(i=>i.c==cur);return `<h2 class="sh" id="sec"><i></i>${e(tc(b,cur))} <small>(${l.length})</small></h2><div class="gr">${l.map(card).join('')}</div>`})():''}
 <h2 class="sh"><i></i>${T('فروعنا')} 🏬</h2>${D.branches.map(x=>`<div class="br"><h3>${e(x.name)}</h3>${ctc(x)}${u(x.map)?`<a class="mp2" href="${u(x.map)}" target="_blank" rel="noopener">📍 الموقع</a>`:''}</div>`).join('')}
 ${cnt&&!b.noOrd?`<div class="bar"><button onclick="sheet()">${T('عرض الطلب')} (${cnt}) — ${money(tot)}</button></div>`:''}`;
 ['.cs','.hs'].forEach((s,k)=>{const q=document.querySelector(s);if(q)q.scrollLeft=px[k]});
}
function ci(b,c){if(b.cimg&&b.cimg[c])return b.cimg[c];const i=b.items.find(i=>i.c==c&&i.img);return i&&i.img}
function add(id,d){if(B().noOrd){toast('استقبال الطلبات متوقف مؤقتاً');return}cart[id]=Math.max(0,(cart[id]||0)+d);render();if($('#ov').innerHTML)sheet()}
/* ---------- الطلب ---------- */
const LS={get(k){try{return localStorage.getItem(k)||''}catch(x){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(x){}}};
function sheet(){
 const b=B(),ls=b.items.filter(i=>cart[i.id]);
 if(!ls.length){$('#ov').innerHTML='';return}
 const tot=ls.reduce((s,i)=>s+cart[i.id]*i.p,0),v=id=>($('#'+id)||{}).value||'';
 const keep={nm:v('nm')||LS.get('c_nm'),ph:v('ph')||LS.get('c_ph'),nt:v('nt')};
 $('#ov').innerHTML=`<div class="ov"><div class="w"><h1>${T('طلبك')} — ${e(b.name)}</h1>${ls.map(i=>`<div class="row box"><span>${cart[i.id]}× ${e(tn(i))}</span><b style="text-align:left">${money(cart[i.id]*i.p)}</b></div>`).join('')}
 <h3>${T('المجموع')}: ${money(tot)}</h3>
 ${TBL?`<div class="box tbx"><span>🪑 رقم الطاولة</span><small>(ثابت)</small><b>${e(TBL.n)}</b></div>`:''}
 <label class="fl" for="nm">${T('الاسم')}</label><input id="nm" autocomplete="name" placeholder="اكتب اسمك" value="${e(keep.nm)}">
 <label class="fl" for="ph">${T('رقم الهاتف')}</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="07xxxxxxxxx" value="${e(keep.ph)}">
 <label class="fl" for="nt">${T('ملاحظات')}</label><textarea id="nt" rows="2" placeholder="مثال: بدون بصل">${e(keep.nt)}</textarea>
 <button class="b p" style="width:100%;padding:13px;margin-top:12px" onclick="send()">${b.waOff?'إرسال الطلب':'إرسال الطلب عبر واتساب 💬'}</button>
 <button class="b" style="width:100%;margin-top:8px" onclick="$('#ov').innerHTML=''">${T('رجوع')}</button></div></div>`;
}
document.documentElement.dir=LGo()=='en'?'ltr':'rtl';
let RV=0;
function rateM(){RV=0;$('#ov').innerHTML=`<div class="ov"><div class="w"><h1>قيّم تجربتك — ${e(B().name)}</h1><div class="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}" onclick="rstar(${n})" aria-label="${n}">★</button>`).join('')}</div>
 <label class="fl" for="rn">الاسم (اختياري)</label><input id="rn" placeholder="اسمك"><label class="fl" for="rc">ملاحظتك (اختياري)</label><textarea id="rc" rows="3"></textarea>
 <button class="b p" style="width:100%;padding:13px;margin-top:12px" onclick="sendRate()">إرسال التقييم</button><button class="b" style="width:100%;margin-top:8px" onclick="$('#ov').innerHTML=''">رجوع</button></div></div>`}
async function ratesM(){const b=B();let L=[];try{L=await (await fetch('/api/rates/public?b='+encodeURIComponent(b.id),{cache:'no-cache'})).json()}catch(x){}
 const sm=RS[b.id]||{a:0,n:L.length};
 $('#ov').innerHTML=`<div class="ov"><div class="w"><h1>⭐ ${sm.a||''} <small style="font-size:15px;color:var(--mu)">(${sm.n})</small></h1><div class="mu" style="margin-bottom:8px">${e(b.name)}</div>
 ${L.length?L.map(r=>`<div class="box" style="margin:8px 0"><div style="display:flex;gap:8px;align-items:center"><span style="color:#f5b301;letter-spacing:1px">${'★'.repeat(r.s)}<span style="color:#cbd5e1">${'★'.repeat(5-r.s)}</span></span><b>${e(r.n||'')}</b><small style="margin-inline-start:auto;color:var(--mu)">${e(new Date(r.ts).toLocaleDateString('ar-IQ'))}</small></div>${r.c?`<div style="margin-top:6px">${e(r.c)}</div>`:''}</div>`).join(''):'<p class="mu">—</p>'}
 <button class="b p" style="width:100%;padding:13px;margin-top:12px" onclick="rateM()">${T('قيّم تجربتك')}</button><button class="b" style="width:100%;margin-top:8px" onclick="$('#ov').innerHTML=''">${T('رجوع')}</button></div></div>`}
function rstar(n){RV=n;document.querySelectorAll('.stars button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=n))}
async function sendRate(){if(!RV){toast('اختر عدد النجوم');return}const b=B();
 try{const r=await fetch('/api/rate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({b:b.id,s:RV,n:($('#rn')||{}).value,c:($('#rc')||{}).value})});if(!r.ok)throw 0;$('#ov').innerHTML='';toast('شكراً لتقييمك ⭐');fetch('/api/rating-sum',{cache:'no-cache'}).then(r=>r.json()).then(j=>{RS=j;render()}).catch(()=>{})}catch(x){toast('تعذر إرسال التقييم، حاول لاحقاً')}}
let SND=0;
async function send(){
 if(SND)return;
 const b=B(),ls=b.items.filter(i=>cart[i.id]),v=id=>$('#'+id).value.trim(),noWa=!!b.waOff;
 let w=String(b.wa||'').replace(/\D/g,'');if(!noWa&&!w){toast('رقم واتساب الفرع غير مضاف');return}
 if(w[0]=='0')w='964'+w.slice(1);
 if(!v('nm')){toast('اكتب الاسم');$('#nm').focus();return}
 if(v('ph').replace(/\D/g,'').length<7){toast('اكتب رقم هاتف صحيح');$('#ph').focus();return}
 SND=1;const btn=document.querySelector('.ov .b.p');if(btn){btn.disabled=true;btn.textContent='جارٍ الإرسال…'}
 // نفتح نافذة واتساب فوراً (ضمن ضغطة المستخدم) ثم نعبّئ الرابط بعد أخذ رقم الطلب من السيرفر
 let wn=null;if(!noWa){try{wn=window.open('','_blank')}catch(x){}}
 const tot=ls.reduce((s,i)=>s+cart[i.id]*i.p,0);let no=null,fail=0;
 LS.set('c_nm',v('nm'));LS.set('c_ph',v('ph'));
 for(let t=0;t<3&&!no;t++){try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
  const r=await fetch('/api/order',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({b:b.id,items:ls.map(i=>({id:i.id,q:cart[i.id]})),name:v('nm'),phone:v('ph'),notes:v('nt'),tk:TBL?{t:TBL.t,s:TBL.s}:null})});clearTimeout(tm);
  if(r.ok){no=(await r.json()).no}else{fail=1;if(r.status<500&&r.status!=429)break}}catch(x){fail=1}}
 if(!no){SND=0;try{wn&&wn.close()}catch(x){}toast('تعذر تسجيل الطلب وأخذ رقمه، تحقق من الاتصال وحاول مرة أخرى');if(btn){btn.disabled=false;btn.textContent=noWa?'إرسال الطلب':'إرسال الطلب عبر واتساب 💬'}return}
 if(noWa){SND=0;if(fail||!no){try{wn&&wn.close()}catch(x){}toast('تعذر إرسال الطلب، حاول مرة أخرى');if(btn){btn.disabled=false;btn.textContent='إرسال الطلب'}return}
  cart={};$('#ov').innerHTML='';render();toast('✓ تم إرسال طلبك رقم #'+no);return}
 const nf=n=>Number(n||0).toLocaleString('en-US');
 let m=`اهلا وسهلا بك بمطعم ${D.name}\nرقم الطلب الخاص بك هو ${no}\n\nمعلومات الطلب :\n`+ls.map(i=>`▪️${i.n} X ${cart[i.id]}`).join('\n')+`\n\n\nمعلومات الزبون :\n👤 ${v('nm')}\n☎️ ${v('ph')}`;
 if(TBL)m+=`\n🪑 الطاولة: ${TBL.n}`;
 if(v('nt'))m+=`\n📝 ملاحظات: ${v('nt')}`;
 m+=`\n\n\nالمجموع الكلي للطلب : ${nf(tot)} IQD`;
 const url='https://wa.me/'+w+'?text='+encodeURIComponent(m);SND=0;if(btn){btn.disabled=false;btn.textContent='إرسال الطلب عبر واتساب 💬'}
 if(wn&&!wn.closed){wn.location.href=url}else{location.href=url}
}
/* ---------- السمات والعروض ---------- */
function applyOffers(b){const n=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),os=(b.offers||[]).filter(o=>(!o.from||o.from<=n)&&(!o.to||o.to>=n));
 b.items.forEach(i=>{if(i.o>i.p)return;let best=i.p;os.forEach(o=>{const t=o.t||[];if(!(o.scope=='all'||o.scope=='cat'&&t.includes(i.c)||o.scope=='item'&&t.includes(i.id)))return;const np=o.type=='fix'?Math.max(0,i.p-o.val):Math.round(i.p*(1-o.val/100));if(np<best)best=np});if(best<i.p){i.o=i.p;i.p=best}})}
/* ---------- تحميل ومزامنة مباشرة ---------- */
async function load(first){
 const [m,t,rs]=await Promise.all([fetch('/api/menu',{cache:'no-cache'}).then(r=>r.json()),fetch('/api/top',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({})),fetch('/api/rating-sum',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({}))]);
 const id=(B()||{}).id;
 D=m;TOP=t||{};RS=rs||{};
 D.branches.forEach(x=>{x.items=(x.items||[]).filter(i=>i.a!==false);applyOffers(x)});applyTheme(D.theme);
 const k=D.branches.findIndex(b=>b.id==id);if(k>=0)bi=k;else if(!first){bi=0;cat=''}
}
let ver=-1,chk=0;
async function poll(){
 if(chk||document.hidden)return;chk=1;
 try{const j=await (await fetch('/api/v',{cache:'no-store'})).json();
  if(j.v!==ver){ver=j.v;const open=$('#ov').innerHTML;await load();if(!open)render()}}catch(x){}
 chk=0}
setInterval(poll,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
const h0=location.hash.slice(1);
(async()=>{try{await load(true);ver=D._v|0}catch(x){}
 if(TBL){const k=D.branches.findIndex(b=>b.id==TBL.b);if(k<0){location.replace('/');return}bi=k;sp=0}
 else{const hi=D.branches.findIndex(b=>b.id==h0);if(hi>=0){bi=hi;sp=0}}
 render()})();
</script></body></html>
