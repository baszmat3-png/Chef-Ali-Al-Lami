<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشيف علي اللامي — المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="/themes.js"></script>
<style>
:root{--pr:var(--ac);--ab:var(--ac);--at:var(--ax);--bg:#0b0b0e;--cd:#16161b;--tx:#fff;--mu:#a9a9b3;--ac:#e8c468;--bd:#2a2a32;--ax:#111;--cb:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Tajawal,system-ui,Tahoma,sans-serif;padding-bottom:90px}
.w{max-width:640px;margin:auto;padding:12px}h1{font-size:28px;margin:6px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.tabs button,.b{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit;white-space:nowrap;cursor:pointer}
.tabs .on,.b.p{background:var(--ac);color:var(--ax);border-color:var(--ac);font-weight:700}
.b.r{color:#ff6b6b;border-color:#ff6b6b}
.hd{text-align:center;padding:30px 0 6px}.hd h1{font-size:34px;font-weight:800;margin:14px 0 10px}
.lg{width:120px;height:120px;border-radius:30px;object-fit:cover;background:var(--cd);border:1px solid var(--bd);display:grid;place-items:center;font-size:48px;margin:auto}
.ln{display:block;width:70px;height:3px;background:var(--ac);margin:8px auto 14px;border-radius:3px}
.mu{display:block;color:var(--mu);margin:4px 0;text-decoration:none}
.pill{display:inline-block;border:2px solid var(--bd);border-radius:22px;padding:5px 16px;margin:8px 0;background:var(--cd)}
.soc{display:flex;gap:10px;justify-content:center;margin:10px 0}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-weight:800;font-size:20px}
.soc .mp{width:auto;border-radius:24px;padding:0 20px;background:#2d2d33;font-size:16px}
.of{display:inline-block;background:linear-gradient(90deg,#e8365d,#f0546f);border-radius:24px;padding:8px 22px;margin:16px 0 6px;font-weight:700}
.cs{display:flex;gap:10px;overflow-x:auto;padding:8px 0 12px}
.ct{flex:none;width:112px;height:140px;border-radius:20px;border:3px solid var(--cb);background:var(--cd) center/cover;color:#fff;font:700 15px Tajawal,sans-serif;display:flex;align-items:flex-end;justify-content:center;padding:8px;cursor:pointer;text-shadow:0 1px 4px #000}
.ct.on{border-color:var(--ac);color:var(--ac)}
.sh{display:flex;align-items:center;gap:10px;font-size:26px;margin:34px 0 14px;scroll-margin-top:12px}
.sh i{width:5px;height:30px;background:var(--ac);border-radius:3px}.sh small{color:var(--mu);font-size:14px;font-weight:400}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{position:relative;aspect-ratio:3/3.7;border-radius:22px;border:1px solid var(--bd);overflow:hidden;background:#1c1c22}
.im2{position:absolute;inset:0;background:center/cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:.4}
.cd:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.85))}
.acs{position:absolute;top:8px;left:8px;z-index:2;display:flex;gap:8px;align-items:center}
.pl{min-width:44px;height:44px;border-radius:50%;border:0;background:var(--ab);color:var(--at);font-size:26px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0}
.pt{display:none;font:700 15px Tajawal,sans-serif}
.hrt{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}.hrt.on{color:#ff4d6d}
.qp{display:flex;align-items:center;gap:6px;background:var(--ab);color:var(--at);border-radius:22px;padding:2px 6px}
.qp button{border:0;background:none;color:inherit;font-size:24px;width:30px;height:34px;font-weight:700}
.bd{position:absolute;top:10px;right:10px;z-index:2;background:var(--ac);color:var(--ax);border-radius:14px;padding:2px 10px;font-weight:700;font-size:14px}
.ft{position:absolute;inset:auto 0 0 0;z-index:2;padding:10px 12px}
.ft b{display:block;font-size:17px;line-height:1.3}.ft small{display:block;color:#ddd;font-size:12px;max-height:2.8em;overflow:hidden}
.pp{display:flex;gap:8px;align-items:baseline;margin-top:4px}.pp span{color:var(--pr);font-weight:800;font-size:18px}.pp s{color:var(--mu);font-size:12px}
.br{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0}
.br h3{margin:0 0 6px;font-size:21px}.br .mp2{display:inline-block;background:var(--ac);color:var(--ax);border-radius:22px;padding:8px 20px;font-weight:700;text-decoration:none;margin-top:8px}
.it{display:flex;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0}
.im{width:92px;height:92px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none;display:grid;place-items:center;font-size:32px}
.it .in{flex:1;min-width:0}.it b{display:block}.d{color:var(--mu);font-size:14px}
.bar{position:fixed;inset:auto 0 0 0;z-index:3;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd)}
.bar button{width:100%;max-width:616px;display:block;margin:auto;padding:13px;border:0;border-radius:16px;background:var(--ac);color:var(--ax);font:800 17px Tajawal,sans-serif}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 40px;z-index:6}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:16px;padding:3px 10px;margin:3px}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:8px 16px;border-radius:20px;z-index:9;display:none}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:0}
.sp{position:fixed;inset:0;z-index:5;background:#0b0b0e center/cover;overflow:hidden}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sov{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.82))}
.sc{position:relative;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2vh;padding:calc(3vh + env(safe-area-inset-top,0px)) 20px calc(3vh + env(safe-area-inset-bottom,0px));text-align:center}
.sp .lg{border-radius:50%;width:clamp(80px,17vh,150px);height:clamp(80px,17vh,150px);font-size:clamp(32px,7vh,60px);border:3px solid rgba(255,255,255,.6)}
.sp h1{font-size:clamp(24px,5vh,44px);line-height:1.3;font-weight:800;margin:1.5vh 0 0}
.sp .soc{margin:0}.sp .soc:empty{display:none}.sp .soc a{width:clamp(36px,5.5vh,48px);height:clamp(36px,5.5vh,48px);font-size:clamp(16px,2.4vh,20px)}.sp .soc .mp{width:auto;font-size:clamp(14px,2.2vh,16px)}
.bps{display:flex;flex-wrap:wrap;gap:1.2vh 10px;justify-content:center;margin:1.2vh 0;max-height:30vh;overflow-y:auto}
.bp{border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;border-radius:30px;padding:clamp(8px,1.6vh,13px) 24px;font:700 clamp(15px,2.3vh,18px) Tajawal,sans-serif;cursor:pointer}
.bp.on{background:#fff;color:var(--ax);border-color:#fff}
.go{border:0;border-radius:36px;background:var(--ac);color:var(--ax);padding:clamp(11px,2.2vh,18px) 54px;font:800 clamp(18px,2.8vh,22px) Tajawal,sans-serif;cursor:pointer;margin-top:1vh}
.ft,.sp{color:#fff}.ct.ni{color:var(--tx);text-shadow:none}.ct.ni.on{color:var(--ac)}
.dwb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5)}
.dwp{position:fixed;top:0;bottom:0;right:0;width:min(86vw,380px);background:var(--cd);color:var(--tx);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:-8px 0 30px rgba(0,0,0,.3);animation:dwi .22s ease-out}
@keyframes dwi{from{transform:translateX(100%)}to{transform:none}}
.dwh{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--bd)}
.dwh img,.dwh .dl{width:48px;height:48px;border-radius:14px;object-fit:cover;display:grid;place-items:center;background:var(--bd);font-size:24px;flex:none}
.dwh b{flex:1;font-size:19px}
.dwh button{width:44px;height:44px;border-radius:50%;border:0;background:var(--bd);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.dwl{padding:14px 18px 6px;color:var(--mu);font-size:14px}
.dwn{overflow:auto;padding:4px 12px calc(20px + env(safe-area-inset-bottom,0px));flex:1}
.dwn button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:19px;padding:15px 16px;border-radius:16px;cursor:pointer;text-align:right}
.dwn button small{color:var(--mu);font-size:15px}
.dwn button.on{background:var(--bd);background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:700}
@media(prefers-reduced-motion:reduce){.dwp{animation:none}}

/* شريط علوي ثابت (بدل الأزرار العائمة التي كانت تغطي المحتوى) */
.tb{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;margin:-12px -12px 0;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.tb .mbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tb .mbtn i{display:block;width:20px;height:2px;border-radius:2px;background:var(--tx)}
.tb .tn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.tb .tn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .tn img,.tb .tn .tl{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--cd);display:grid;place-items:center;flex:none;font-size:18px}
.tb .tt{flex:none;background:var(--ac);color:var(--ax);border-radius:16px;padding:4px 12px;font-weight:800;font-size:14px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity}
.hs .cd{flex:none;width:168px;scroll-snap-align:start}
.hot{background:linear-gradient(90deg,#ff7a18,#e11d2e);color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700;margin-inline-start:8px}
.fl{display:block;font-weight:700;margin:12px 0 2px}
.tbx{display:flex;align-items:center;gap:10px;font-size:18px;border-color:var(--ac)}.tbx b{margin-inline-start:auto;background:var(--ac);color:var(--ax);border-radius:12px;padding:2px 14px}
.tbx small{color:var(--mu)}

/* تخطيطات السمات الفاتحة: صورة بالأعلى ونص تحتها */
.Lc .cd{aspect-ratio:auto;display:flex;flex-direction:column;background:var(--cd);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.Lc .cd:after{display:none}
.Lc .im2{position:relative;inset:auto;width:100%;aspect-ratio:4/3;background-color:var(--bd)}
.Lc .ft{position:static;color:var(--tx);padding:12px 12px 66px}
.Lc .ft small{color:var(--mu)}
.Lc .acs{top:auto;bottom:12px;left:12px}
.Lc .hrt{background:var(--bd);color:var(--tx)}.Lc .hrt.on{color:#ff4d6d}
.Lc .sh,.Lc .hd h1{color:var(--tx)}
.L-card1 .gr{grid-template-columns:1fr}.L-card1 .im2{aspect-ratio:16/10}
.L-card1 .pl,.L-list .pl{padding:0 20px;border-radius:24px;height:44px;font-size:20px}.L-card1 .pt,.L-list .pt{display:inline}
.L-card1 .hs .cd{width:270px}
.L-list .gr{grid-template-columns:1fr}
.L-list .cd{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:12px;min-height:136px;border-radius:18px}
.L-list .im2{width:112px;height:112px;aspect-ratio:1;border-radius:14px}
.L-list .ft{padding:0 0 50px}
.L-list .hs{flex-direction:column;overflow:visible}.L-list .hs .cd{width:auto}
.L-wave .hd{margin:-12px -12px 14px;padding:26px 12px 44px;background:linear-gradient(135deg,#4a0810,#c1121f);color:#fff;border-radius:0 0 50% 50%/0 0 30px 30px}
.L-wave .hd h1,.L-wave .hd .mu,.L-wave .hd .pill{color:#fff}.L-wave .hd .pill{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}
.L-wave .ln{background:#fff}
.L-wave .ct{width:auto;height:46px;border-radius:26px;padding:0 20px;align-items:center;border:2px solid #1b1b1b;background:#fff!important;color:#111;text-shadow:none}
.L-wave .ct.on{background:var(--ab)!important;color:#fff;border-color:#1b1b1b}
</style></head><body>
<div class="w" id="app"></div><div id="ov"></div><div id="dw"></div><div id="t"></div>

<script>
const TBL=window.__TBL||null;
let D={name:'',branches:[]},TOP={};
let sp=1,bi=0,cat='',cart={};
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch(x){}
const HS=on=>`<svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.7 5 6.2 5c2 0 3.3 1.1 3.8 2 .5-.9 1.8-2 3.8-2 3.5 0 5.3 3.6 3.8 6.9C19.5 16.4 12 21 12 21z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
function fav(id){FAV.has(id)?FAV.delete(id):FAV.add(id);try{localStorage.setItem('fav',JSON.stringify([...FAV]))}catch(x){}render()}
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US')+' د.ع';
const B=()=>D.branches[bi];
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2600)}
function sel(){return !TBL&&D.branches.length>1?'<div class="tabs">'+D.branches.map((b,i)=>`<button class="${i==bi?'on':''}" onclick="pickB(${i})">${e(b.name)}</button>`).join('')+'</div>':''}
function pickB(i){bi=i;cat='';cart={};render()}
function u(s){return /^https?:\/\//.test(s||'')?e(s):''}
function socs(b){const s=(k,bg,t)=>u(b[k])?`<a href="${u(b[k])}" target="_blank" rel="noopener" style="background:${bg}">${t}</a>`:'';return `<div class="soc">${s('map','#2d2d33','📍 الموقع').replace('<a ','<a class="mp" ')}${s('tt','#000','♪')}${s('fb','#1877f2','f')}${s('ig','linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)','◎')}</div>`}
function splash(){
 const b=B();
 $('#app').innerHTML=`<div class="sp" style="${D.bg?`background-image:url(${e(D.bg)})`:''}">${D.vid?`<video class="bgv" src="${e(D.vid)}" autoplay muted loop playsinline></video>`:''}<div class="sov"></div>
 <div class="sc">
 <div>${D.logo?`<img class="lg" src="${e(D.logo)}" alt="">`:'<div class="lg">🍽</div>'}<h1>${e(D.name)}</h1></div>
 <div>${D.branches.length>1?`<div class="mu" style="color:#ddd">اختر الفرع</div><div class="bps">${D.branches.map((x,i)=>`<button class="bp ${i==bi?'on':''}" onclick="bi=${i};cart={};splash()">${e(x.name)}</button>`).join('')}</div>`:''}<button class="go" onclick="sp=0;render()">دخول المنيو</button></div>
 ${socs(b)}</div></div>`;
}
function catsOf(b){return b.cats.filter(c=>b.items.some(i=>i.c==c))}
function topOf(b){if(D.noTop)return[];return (TOP[b.id]||[]).map(id=>b.items.find(i=>i.id==id)).filter(Boolean).slice(0,8)}
function drw(o){const d=$('#dw');if(!o){d.innerHTML='';return}const b=B(),cs=catsOf(b),cur=cs.includes(cat)?cat:cs[0],tp=topOf(b);
 d.innerHTML=`<div class="dwb" onclick="drw(0)"></div><aside class="dwp"><div class="dwh">${D.logo?`<img src="${e(D.logo)}" alt="">`:'<div class="dl">🍽</div>'}<b>${e(D.name)}</b><button onclick="drw(0)" aria-label="إغلاق">✕</button></div><div class="dwl">الأقسام</div><nav class="dwn">${tp.length?`<button onclick="drw(0);goTop()"><span>🔥 الأكثر طلباً</span><small>${tp.length}</small></button>`:''}${cs.map(c=>`<button class="${c==cur?'on':''}" data-c="${e(c)}" onclick="pickC(this.dataset.c)"><span>${e(c)}</span><small>${b.items.filter(i=>i.c==c).length}</small></button>`).join('')}</nav></aside>`}
function pickC(c){drw(0);go(c)}
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')drw(0)});
function go(c){cat=c;render();const s=document.getElementById('sec');if(s)s.scrollIntoView({behavior:'smooth'})}
function goTop(){const s=document.getElementById('top');if(s)s.scrollIntoView({behavior:'smooth'})}
const scr=()=>['.cs','.hs'].map(s=>(document.querySelector(s)||{}).scrollLeft||0);
function render(){
 const b=B();
 if(!b){$('#app').innerHTML='<p>لا توجد فروع</p>';return}
 if(sp){splash();return}
 const cnt=Object.values(cart).reduce((a,c)=>a+c,0),tot=b.items.reduce((s,i)=>s+(cart[i.id]||0)*i.p,0);
 const px=scr();
 const fvs=b.items.filter(i=>FAV.has(i.id)),cs=catsOf(b),cur=cs.includes(cat)?cat:cs[0],dis=b.items.some(i=>i.o>i.p),tp=topOf(b);
 const card=i=>{const q=cart[i.id]||0,off=i.o>i.p?Math.round((1-i.p/i.o)*100):0,fv=FAV.has(i.id);
  return `<div class="cd"><div class="im2" style="${i.img?`background-image:url(${e(i.img)})`:''}">${i.img?'':'<div class="ph">🍽</div>'}</div>${off?`<span class="bd">-${off}%</span>`:''}<div class="acs"><button class="hrt ${fv?'on':''}" onclick="fav('${i.id}')" aria-label="المفضلة">${HS(fv)}</button>${q?`<div class="qp"><button onclick="add('${i.id}',-1)">−</button><b>${q}</b><button onclick="add('${i.id}',1)">+</button></div>`:`<button class="pl" onclick="add('${i.id}',1)"><span class="pt">إضافة</span>+</button>`}</div><div class="ft"><b>${e(i.n)}</b>${i.d?`<small>${e(i.d)}</small>`:''}<div class="pp"><span>${money(i.p)}</span>${i.o>i.p?`<s>${money(i.o)}</s>`:''}</div></div></div>`};
 const so=(k,bg,t)=>u(b[k])?`<a href="${u(b[k])}" target="_blank" rel="noopener" style="background:${bg}">${t}</a>`:'';
 $('#app').innerHTML=`<header class="tb"><button class="mbtn" onclick="drw(1)" aria-label="الأقسام"><i></i><i></i><i></i></button><div class="tn">${D.logo?`<img src="${e(D.logo)}" alt="">`:'<div class="tl">🍽</div>'}<b>${e(D.name)}</b></div>${TBL?`<span class="tt">🪑 طاولة ${e(TBL.n)}</span>`:''}</header>
 <div class="hd">${D.logo?`<img class="lg" src="${e(D.logo)}" alt="">`:'<div class="lg">🍽</div>'}<h1>${e(D.name)}</h1><i class="ln"></i>${sel()}
 ${b.ad?`<span class="mu">📍 ${e(b.ad)}</span>`:''}${b.wa?`<a class="mu" dir="ltr" href="tel:${e(b.wa)}">📞 ${e(b.wa)}</a>`:''}${b.hr?`<span class="pill">🕒 ${e(b.hr)}</span>`:''}
 <div class="soc">${so('map','#2d2d33','📍 الموقع').replace('<a ','<a class="mp" ')}${so('tt','#000','♪')}${so('fb','#1877f2','f')}${so('ig','linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)','◎')}</div>
 ${dis?'<span class="of">🎉 عروض وخصومات</span>':''}</div>
 ${tp.length?`<h2 class="sh" id="top"><i></i>🔥 الأكثر طلباً</h2><div class="hs">${tp.map(card).join('')}</div>`:''}
 ${fvs.length?`<h2 class="sh"><i></i>❤️ المفضلة</h2><div class="hs">${fvs.map(card).join('')}</div>`:''}
 <div class="cs">${cs.map(c=>`<button class="ct ${c==cur?'on':''} ${ci(b,c)?'':'ni'}" data-c="${e(c)}" style="${ci(b,c)?`background-image:linear-gradient(transparent 40%,rgba(0,0,0,.7)),url(${e(ci(b,c))})`:''}" onclick="go(this.dataset.c)">${e(c)}</button>`).join('')}</div>
 ${cur?(()=>{const l=b.items.filter(i=>i.c==cur);return `<h2 class="sh" id="sec"><i></i>${e(cur)} <small>(${l.length})</small></h2><div class="gr">${l.map(card).join('')}</div>`})():''}
 <h2 class="sh"><i></i>فروعنا 🏬</h2>${D.branches.map(x=>`<div class="br"><h3>${e(x.name)}</h3>${x.ad?`<div class="mu">📍 ${e(x.ad)}</div>`:''}${x.wa?`<a class="mu" dir="ltr" href="tel:${e(x.wa)}">📞 ${e(x.wa)}</a>`:''}${u(x.map)?`<a class="mp2" href="${u(x.map)}" target="_blank" rel="noopener">📍 الموقع</a>`:''}</div>`).join('')}
 ${cnt?`<div class="bar"><button onclick="sheet()">عرض الطلب (${cnt}) — ${money(tot)}</button></div>`:''}`;
 ['.cs','.hs'].forEach((s,k)=>{const q=document.querySelector(s);if(q)q.scrollLeft=px[k]});
}
function ci(b,c){if(b.cimg&&b.cimg[c])return b.cimg[c];const i=b.items.find(i=>i.c==c&&i.img);return i&&i.img}
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);render();if($('#ov').innerHTML)sheet()}
/* ---------- الطلب ---------- */
const LS={get(k){try{return localStorage.getItem(k)||''}catch(x){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(x){}}};
function sheet(){
 const b=B(),ls=b.items.filter(i=>cart[i.id]);
 if(!ls.length){$('#ov').innerHTML='';return}
 const tot=ls.reduce((s,i)=>s+cart[i.id]*i.p,0),v=id=>($('#'+id)||{}).value||'';
 const keep={nm:v('nm')||LS.get('c_nm'),ph:v('ph')||LS.get('c_ph'),nt:v('nt')};
 $('#ov').innerHTML=`<div class="ov"><div class="w"><h1>طلبك — ${e(b.name)}</h1>${ls.map(i=>`<div class="row box"><span>${cart[i.id]}× ${e(i.n)}</span><b style="text-align:left">${money(cart[i.id]*i.p)}</b></div>`).join('')}
 <h3>المجموع: ${money(tot)}</h3>
 ${TBL?`<div class="box tbx"><span>🪑 رقم الطاولة</span><small>(ثابت)</small><b>${e(TBL.n)}</b></div>`:''}
 <label class="fl" for="nm">الاسم</label><input id="nm" autocomplete="name" placeholder="اكتب اسمك" value="${e(keep.nm)}">
 <label class="fl" for="ph">رقم الهاتف</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="07xxxxxxxxx" value="${e(keep.ph)}">
 <label class="fl" for="nt">ملاحظات</label><textarea id="nt" rows="2" placeholder="مثال: بدون بصل">${e(keep.nt)}</textarea>
 <button class="b p" style="width:100%;padding:13px;margin-top:12px" onclick="send()">إرسال الطلب عبر واتساب 💬</button>
 <button class="b" style="width:100%;margin-top:8px" onclick="$('#ov').innerHTML=''">رجوع</button></div></div>`;
}
function send(){
 const b=B(),ls=b.items.filter(i=>cart[i.id]),v=id=>$('#'+id).value.trim();
 let w=String(b.wa||'').replace(/\D/g,'');if(!w){toast('رقم واتساب الفرع غير مضاف');return}
 if(w[0]=='0')w='964'+w.slice(1);
 if(!v('nm')){toast('اكتب الاسم');$('#nm').focus();return}
 if(v('ph').replace(/\D/g,'').length<7){toast('اكتب رقم هاتف صحيح');$('#ph').focus();return}
 const tot=ls.reduce((s,i)=>s+cart[i.id]*i.p,0);
 let m=`🛎 طلب جديد — ${b.name}\n\n`+ls.map(i=>`${cart[i.id]}× ${i.n} — ${money(cart[i.id]*i.p)}`).join('\n')+`\n\nالمجموع: ${money(tot)}\n`;
 if(TBL)m+=`\n🪑 الطاولة: ${TBL.n}`;
 m+=`\n👤 الاسم: ${v('nm')}\n📞 الرقم: ${v('ph')}`;if(v('nt'))m+=`\n📝 ملاحظات: ${v('nt')}`;
 LS.set('c_nm',v('nm'));LS.set('c_ph',v('ph'));
 // تسجيل الطلب على السيرفر (يُستخدم في الطلبات والأكثر طلباً) — دون انتظار حتى لا يُحجب فتح واتساب
 try{fetch('/api/order',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({b:b.id,items:ls.map(i=>({id:i.id,q:cart[i.id]})),name:v('nm'),phone:v('ph'),notes:v('nt'),tk:TBL?{t:TBL.t,s:TBL.s}:null})}).catch(()=>{})}catch(x){}
 const a=document.createElement('a');a.href='https://wa.me/'+w+'?text='+encodeURIComponent(m);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
/* ---------- السمات والعروض ---------- */
function applyOffers(b){const n=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),os=(b.offers||[]).filter(o=>(!o.from||o.from<=n)&&(!o.to||o.to>=n));
 b.items.forEach(i=>{if(i.o>i.p)return;let best=i.p;os.forEach(o=>{const t=o.t||[];if(!(o.scope=='all'||o.scope=='cat'&&t.includes(i.c)||o.scope=='item'&&t.includes(i.id)))return;const np=o.type=='fix'?Math.max(0,i.p-o.val):Math.round(i.p*(1-o.val/100));if(np<best)best=np});if(best<i.p){i.o=i.p;i.p=best}})}
/* ---------- تحميل ومزامنة مباشرة ---------- */
async function load(first){
 const [m,t]=await Promise.all([fetch('/api/menu',{cache:'no-cache'}).then(r=>r.json()),fetch('/api/top',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({}))]);
 const id=(B()||{}).id;
 D=m;TOP=t||{};
 D.branches.forEach(x=>{x.items=(x.items||[]).filter(i=>i.a!==false);applyOffers(x)});applyTheme(D.theme);
 const k=D.branches.findIndex(b=>b.id==id);if(k>=0)bi=k;else if(!first){bi=0;cat=''}
}
let ver=-1,chk=0;
async function poll(){
 if(chk||document.hidden)return;chk=1;
 try{const j=await (await fetch('/api/v',{cache:'no-store'})).json();
  if(j.v!==ver){ver=j.v;const open=$('#ov').innerHTML;await load();if(!open)render()}}catch(x){}
 chk=0}
setInterval(poll,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
const h0=location.hash.slice(1);
(async()=>{try{await load(true);ver=D._v|0}catch(x){}
 if(TBL){const k=D.branches.findIndex(b=>b.id==TBL.b);if(k<0){location.replace('/');return}bi=k;sp=0}
 else{const hi=D.branches.findIndex(b=>b.id==h0);if(hi>=0){bi=hi;sp=0}}
 render()})();
</script></body></html>
