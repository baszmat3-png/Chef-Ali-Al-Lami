name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # نسخة تجريبية قابلة للتثبيت مباشرة على الجوال (موقّعة بمفتاح التطوير)
      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Prepare signing key
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لم تُضبط أسرار التوقيع (KEYSTORE_BASE64 ...) فتم بناء النسخة التجريبية فقط."
          fi

      # النسخة الرسمية للمتجر: AAB (للرفع على Google Play) + APK موقّع
      - name: Build signed release (AAB + APK)
        if: steps.key.outputs.has == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/chef-ali-menu-debug.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/chef-ali-menu-release.aab; fi
          if ls android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then cp android/app/build/outputs/apk/release/*.apk out/chef-ali-menu-release.apk; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: chef-ali-menu-android
          path: out/*
          retention-days: 30
